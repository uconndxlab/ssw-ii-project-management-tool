name: Preview

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'preview/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Production credentials must never run alongside code from the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Prepare PostgreSQL tools
        run: docker pull postgres:18

      - name: Initialize database and deploy preview
        env:
          LARAVEL_CLOUD_TOKEN: ${{ secrets.LARAVEL_CLOUD_TOKEN }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CLOUD_APPLICATION_ID: ${{ vars.CLOUD_APPLICATION_ID }}
          CLOUD_PRODUCTION_ENVIRONMENT_ID: ${{ vars.CLOUD_PRODUCTION_ENVIRONMENT_ID }}
        run: python3 -B .github/scripts/preview.py
